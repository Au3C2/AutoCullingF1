name: engine-test

# Engine tests — seed-protocol precision / determinism / performance gates
# across both platforms, in ONE workflow:
#
#   macOS (macos-14, Apple Silicon):
#     perf-calibrate      — manual dispatch only: measures runner baselines,
#                           uploads tests/ci/ci_config.json to commit back
#     precision           — packaged vs source score consistency
#     perf-source         — seed steady state, source CLI (tolerance 0.65,
#                           single retry against one-sided runner noise)
#     perf-packaged       — same gate against the packaged onedir binary
#     deterministic-cpu   — seed replication vs committed deterministic truth
#
#   Windows (windows-latest):
#     deterministic-cpu   — CULL_DETERMINISTIC=1 vs tests/baselines (strict)
#     gpu-alignment       — default CUDA path vs the same truth
#     perf-seed           — Windows perf gate via the same 4-seed protocol
#
# Deterministic mode is CPU-only + software decode, so the seed protocol is
# enough to lock cross-platform equality without the full 1.3 GB datasets.
# Perf baselines are runner-calibrated (perf-calibrate) and stored per
# platform in tests/ci/ci_config.json; uncalibrated runner types skip.

on:
  push:
    branches: [develop, master]
  pull_request:
  workflow_dispatch:
    inputs:
      count:
        description: "files per dataset (macOS calibrate; debug the VM hang)"
        type: number
        default: 500
      samples:
        description: "interleaved samples per format (macOS calibrate)"
        type: number
        default: 3

concurrency:
  group: engine-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- manual: measure runner baselines, commit result as tests/ci/ci_config.json ----
  perf-calibrate:
    runs-on: macos-14
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
      - name: Install runtime deps into .venv
        run: |
          uv venv .venv --python 3.10
          uv pip install --python .venv/bin/python \
            "opencv-python==5.0.0.93" "onnxruntime==1.23.2" "numpy>=1.26" \
            "pillow>=10.0" "pillow-heif>=0.18.0" "av>=17.0" "scipy>=1.15" \
            "pyinstaller"
      - name: Calibrate source seed performance
        timeout-minutes: 40
        run: |
          mkdir -p build
          .venv/bin/python benchmarks/run_benchmarks.py --workers 2 \
            --seed-dir tests/ci/sample --count ${{ inputs.count }} \
            --samples ${{ inputs.samples }} --cooldown 5 --no-guard \
            --json build/calib_source.json --no-prewarm
      - name: Build onedir
        timeout-minutes: 10
        run: .venv/bin/python packaging/build.py --onedir
      - name: Calibrate packaged seed performance
        timeout-minutes: 40
        run: |
          CULL_EXE="dist/engine/auto_culling_cli"
          echo "Using CULL_EXE: $CULL_EXE"
          CULL_EXE="$CULL_EXE" .venv/bin/python benchmarks/run_benchmarks.py --workers 2 \
            --seed-dir tests/ci/sample --count ${{ inputs.count }} \
            --samples ${{ inputs.samples }} --cooldown 5 --no-guard \
            --json build/calib_onedir.json
      - name: Merge into tests/ci/ci_config.json
        run: |
          python - <<'EOF'
          import json, pathlib
          base = json.loads(pathlib.Path("tests/ci/ci_config.json").read_text())
          src = json.loads(pathlib.Path("build/calib_source.json").read_text())["results"]
          od  = json.loads(pathlib.Path("build/calib_onedir.json").read_text())["results"]
          base["baselines"] = {
              "source": {f: src[f]["steady"] for f in src},
              "onedir": {f: od[f]["steady"] for f in od},
          }
          pathlib.Path("build/ci_config.json").write_text(
              json.dumps(base, indent=2))
          EOF
      - name: Upload calibrated config
        uses: actions/upload-artifact@v4
        with:
          name: ci_config.json
          path: build/ci_config.json
      - name: Next step
        run: |
          echo "Download ci_config.json and commit it to tests/ci/ci_config.json to "
          echo "enable the guarded steps on this runner type."

  # ------------------------------------------------------------------
  # Automatic tests on every push/PR — parallel jobs so wall clock is
  # ~ one perf gate (~7 min at count=120, samples=2) + build + precision
  # + deterministic, not their sum.  workers=2 is mandated on the macOS
  # VM runner (workers=4 stalls there).
  # ------------------------------------------------------------------

  precision:
    name: precision (macos)
    runs-on: macos-14
    if: github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
      - name: Install runtime deps into .venv
        run: |
          uv venv .venv --python 3.10
          uv pip install --python .venv/bin/python \
            "opencv-python==5.0.0.93" "onnxruntime==1.23.2" "numpy>=1.26" \
            "pillow>=10.0" "pillow-heif>=0.18.0" "av>=17.0" "scipy>=1.15" \
            "pyinstaller"
      - name: Build onedir (needed by the precision comparison)
        run: .venv/bin/python packaging/build.py --onedir
      - name: Precision — packaged vs source consistency
        run: .venv/bin/python tests/ci/seed_precision.py --compare

  perf-source:
    name: perf-source (macos)
    runs-on: macos-14
    if: github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
      - name: Install runtime deps into .venv
        run: |
          uv venv .venv --python 3.10
          uv pip install --python .venv/bin/python \
            "opencv-python==5.0.0.93" "onnxruntime==1.23.2" "numpy>=1.26" \
            "pillow>=10.0" "pillow-heif>=0.18.0" "av>=17.0" "scipy>=1.15" \
            "pyinstaller"
      - name: Skip unless runner calibrated
        run: |
          .venv/bin/python - <<'PY'
          import json, pathlib, sys
          d = json.loads(pathlib.Path("tests/ci/ci_config.json").read_text())
          if d.get("baselines", {}).get("source"):
              print("calibrated")
          else:
              print("skip: tests/ci/ci_config.json baselines empty (run perf-calibrate on this runner type)")
          PY
      - name: Performance — seed steady state (source CLI)
        timeout-minutes: 25
        run: |
          run_gate() {
            .venv/bin/python benchmarks/run_benchmarks.py --workers 2 \
              --seed-dir tests/ci/sample --count 120 --samples 2 \
              --tolerance 0.65 --baseline-file tests/ci/ci_config.json \
              --json build/ci_source.json
          }
          # Shared-runner noise is one-sided (load spikes only slow runs
          # down); a single retry absorbs the flaky tail while genuine
          # multi-minute regressions still fail both attempts.
          if ! run_gate; then
            echo "gate failed once; waiting 30s and retrying"
            sleep 30
            run_gate
          fi

  perf-packaged:
    name: perf-packaged (macos)
    runs-on: macos-14
    if: github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
      - name: Install runtime deps into .venv
        run: |
          uv venv .venv --python 3.10
          uv pip install --python .venv/bin/python \
            "opencv-python==5.0.0.93" "onnxruntime==1.23.2" "numpy>=1.26" \
            "pillow>=10.0" "pillow-heif>=0.18.0" "av>=17.0" "scipy>=1.15" \
            "pyinstaller"
      - name: Build onedir
        run: .venv/bin/python packaging/build.py --onedir
      - name: Skip unless runner calibrated
        run: |
          .venv/bin/python - <<'PY'
          import json, pathlib
          d = json.loads(pathlib.Path("tests/ci/ci_config.json").read_text())
          if d.get("baselines", {}).get("source"):
              print("calibrated")
          else:
              print("skip: tests/ci/ci_config.json baselines empty (run perf-calibrate on this runner type)")
          PY
      - name: Performance — seed steady state (packaged binary)
        timeout-minutes: 25
        run: |
          CULL_EXE="dist/engine/auto_culling_cli"
          echo "Using CULL_EXE: $CULL_EXE"
          test -x "$CULL_EXE" || { echo "Binary not found or not executable: $CULL_EXE"; ls -la dist/; exit 1; }
          run_gate() {
            CULL_EXE="$CULL_EXE" .venv/bin/python benchmarks/run_benchmarks.py --workers 2 \
              --seed-dir tests/ci/sample --count 120 --samples 2 \
              --tolerance 0.65 --baseline-file tests/ci/ci_config.json \
              --json build/ci_onedir.json
          }
          # Same one-sided-noise retry rationale as perf-source.
          if ! run_gate; then
            echo "gate failed once; waiting 30s and retrying"
            sleep 30
            run_gate
          fi

  # CPU deterministic truth on both platforms.  Deterministic mode is
  # CPU-only + software decode, so the seed protocol locks cross-platform
  # equality without requiring the full camera datasets.
  deterministic-cpu-macos:
    name: deterministic-cpu (macos)
    runs-on: macos-14
    if: github.event_name != 'workflow_dispatch'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
      - name: Install runtime deps into .venv
        run: |
          uv venv .venv --python 3.10
          uv pip install --python .venv/bin/python \
            "opencv-python==5.0.0.93" "onnxruntime==1.23.2" "numpy>=1.26" \
            "pillow>=10.0" "pillow-heif>=0.18.0" "av>=17.0" "scipy>=1.15" \
            "pytest"
      - name: Deterministic truth — seed replication vs committed baseline
        run: |
          .venv/bin/python -m pytest tests/test_engine/test_deterministic_baseline.py -v \
            -m "deterministic"
      - name: Upload perf artifact (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-deterministic-cpu
          path: build/perf_*.json
          if-no-files-found: ignore

  deterministic-cpu-windows:
    name: deterministic-cpu (windows)
    runs-on: windows-latest
    if: github.event_name != 'workflow_dispatch'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
      - name: Install runtime deps into .venv + exiftool
        run: |
          choco install exiftool -y --no-progress
          uv venv .venv --python 3.10
          uv pip install --python .venv `
            "opencv-python==5.0.0.93" "onnxruntime==1.23.2" "numpy>=1.26" `
            "pillow>=10.0" "pillow-heif>=0.18.0" "av>=17.0" "scipy>=1.15" "pytest"
      - name: Deterministic truth — 70-file gate (strict)
        run: .venv/Scripts/python.exe -m pytest tests/test_engine/test_deterministic_baseline.py -v -m "deterministic"
      - name: Upload perf artifact (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-deterministic-cpu
          path: build/perf_*.json
          if-no-files-found: ignore

  gpu-alignment:
    name: gpu-alignment (windows)
    runs-on: windows-latest
    if: github.event_name != 'workflow_dispatch'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
      - name: Install runtime deps into .venv + exiftool
        run: |
          choco install exiftool -y --no-progress
          uv venv .venv --python 3.10
          uv pip install --python .venv `
            "opencv-python==5.0.0.93" "onnxruntime==1.23.2" "numpy>=1.26" `
            "pillow>=10.0" "pillow-heif>=0.18.0" "av>=17.0" "scipy>=1.15" "pytest"
      - name: GPU alignment — default CUDA vs deterministic truth
        run: .venv/Scripts/python.exe -m pytest tests/test_engine/test_deterministic_baseline.py -v -m "alignment"
      - name: Upload perf artifact (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-gpu-alignment
          path: build/perf_*.json
          if-no-files-found: ignore

  perf-seed:
    name: perf-seed (windows)
    runs-on: windows-latest
    if: github.event_name != 'workflow_dispatch'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
      - name: Install runtime deps into .venv + exiftool
        run: |
          choco install exiftool -y --no-progress
          uv venv .venv --python 3.10
          uv pip install --python .venv `
            "opencv-python==5.0.0.93" "onnxruntime==1.23.2" "numpy>=1.26" `
            "pillow>=10.0" "pillow-heif>=0.18.0" "av>=17.0" "scipy>=1.15" "pytest"
      - name: Perf — seed steady state (Windows, same 4-seed protocol as macOS)
        run: |
          .venv/Scripts/python.exe benchmarks/run_benchmarks.py --workers 4 `
            --seed-dir tests/ci/sample --count ${{ inputs.count || 120 }} `
            --samples ${{ inputs.samples || 2 }} --tolerance 0.65 `
            --baseline-file tests/ci/ci_config.json `
            --json build/ci_windows_perf.json
      - name: Upload perf result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-perf-seed
          path: |
            build/ci_windows_perf.json
            build/perf_*.json
          if-no-files-found: warn
