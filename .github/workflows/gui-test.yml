name: gui-test

# Desktop GUI packaging & installation tests — macOS DMG and Windows
# NSIS/portable, driven by a platform matrix.  Each job builds the packages
# (packaging/build_gui.py), runs the install/launch suite
# (packaging/test_gui_package.py) and uploads the artifacts.
#
# Adding a platform later (e.g. Linux) = one more matrix entry.

on:
  push:
    branches: [develop, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: gui-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gui-test:
    name: gui-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            rust-target: aarch64-apple-darwin
            py: .venv/bin/python
            pre-steps: ""
            artifact-name: AutoCulling-macOS-DMG
            artifact-path: dist/AutoCulling_*.dmg*
          - os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            py: .venv/Scripts/python.exe
            pre-steps: choco install exiftool -y --no-progress
            artifact-name: AutoCulling-Windows-Packages
            artifact-path: |
              dist/AutoCulling_*.exe*
              dist/AutoCulling_*.zip*
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYBIN: ${{ matrix.py }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"

      - name: Install runtime & build dependencies
        shell: bash
        run: |
          ${{ matrix.pre-steps }}
          uv venv .venv --python 3.10
          uv pip install --python "$PYBIN" \
            "opencv-python==5.0.0.93" "onnxruntime==1.23.2" "numpy>=1.26" \
            "pillow>=10.0" "pillow-heif>=0.18.0" "av>=17.0" "scipy>=1.15" \
            "pyinstaller" "pytest"

      - name: Run Tauri Rust unit tests
        shell: bash
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build desktop GUI packages
        shell: bash
        run: $PYBIN packaging/build_gui.py

      - name: Test GUI packages (install / launch / engine handshake)
        shell: bash
        run: $PYBIN packaging/test_gui_package.py

      - name: Upload GUI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
