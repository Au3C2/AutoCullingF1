[package]
name = "auto-culling-gui"
version = "0.1.0"
description = "F1 burst-photo auto-culling desktop app (Tauri shell + Python sidecar)"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
