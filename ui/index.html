<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto-Culling — F1 连拍选片</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">AC</div>
      <div class="brand-text">
        <h1>Auto-Culling</h1>
        <span class="sub">F1 连拍智能选片</span>
      </div>
    </div>
    <div class="dir-row">
      <input id="dir" type="text" placeholder="选择照片目录…" spellcheck="false">
      <button id="pickDir" class="btn">选择目录</button>
    </div>
    <div class="actions">
      <button id="toggleParamsBtn" class="btn" type="button">⚙ 筛片设置</button>
      <button id="start" class="btn primary">开始筛片</button>
      <button id="stop" class="btn danger" disabled>停止</button>
      <button id="export" class="btn" disabled>导出 CSV</button>
    </div>
  </header>

  <section id="params" class="params collapsed">
    <div class="params-grid">
      <div class="param-group">
        <div class="param-title">基本参数</div>
        <div class="param-row">
          <label class="check">
            <input type="checkbox" id="pRecursive"> 递归扫描
            <span class="tip-wrap">
              <span class="info-icon">i</span>
              <span class="tip-content">
                <div class="tip-title">递归扫描子目录</div>
                <div class="tip-def">默认: <span>关闭</span></div>
                <div class="tip-desc">开启后将递归遍历所选目录下的所有层级子文件夹；关闭则仅扫描当前根目录。</div>
              </span>
            </span>
          </label>
          <label class="check">
            <input type="checkbox" id="pForce"> 强制重评
            <span class="tip-wrap">
              <span class="info-icon">i</span>
              <span class="tip-content">
                <div class="tip-title">强制重新分析</div>
                <div class="tip-def">默认: <span>关闭</span></div>
                <div class="tip-desc">开启后强制全量重新运行 AI 打分并覆盖已有结果；关闭时自动跳过已有人工/XMP评级照片。</div>
              </span>
            </span>
          </label>
        </div>
        <div class="param-row">
          <label class="field">
            <span class="lbl">Top-N</span>
            <input type="number" id="pTopN" value="11">
            <span class="tip-wrap">
              <span class="info-icon">i</span>
              <span class="tip-content">
                <div class="tip-title">每连拍保留数</div>
                <div class="tip-def">默认: <span>11</span></div>
                <div class="tip-desc">每组连拍序列中允许评星保留的最大张数。调小筛选更苛刻只留极品，调大保留更多连拍角度。</div>
              </span>
            </span>
          </label>
          <label class="field">
            <span class="lbl">朝向策略</span>
            <select id="pP4">
              <option value="always" selected>always</option>
              <option value="never">never</option>
              <option value="auto">auto</option>
            </select>
            <span class="tip-wrap">
              <span class="info-icon">i</span>
              <span class="tip-content">
                <div class="tip-title">P4 车辆朝向一票否决</div>
                <div class="tip-def">默认: <span>always</span></div>
                <div class="tip-desc">always: 始终自动否决正后方尾部视角；never: 不否决朝向；auto: 仅对 F1 比赛关键词目录启用。</div>
              </span>
            </span>
          </label>
        </div>
        <div class="param-row">
          <label class="field">
            <span class="lbl">解码宽度</span>
            <input type="number" id="pScale" value="1280">
            <span class="tip-wrap">
              <span class="info-icon">i</span>
              <span class="tip-content">
                <div class="tip-title">图像解码缩放宽度 (px)</div>
                <div class="tip-def">默认: <span>1280</span></div>
                <div class="tip-desc">推理前图像缩放长边。调小 (如 800) 加快处理速度；调大 (如 1920) 提升远景小目标精度但耗时上升。</div>
              </span>
            </span>
          </label>
          <label class="field">
            <span class="lbl">并发线程</span>
            <input type="number" id="pWorkers" value="4">
            <span class="tip-wrap">
              <span class="info-icon">i</span>
              <span class="tip-content">
                <div class="tip-title">并行处理 Worker 数</div>
                <div class="tip-def">默认: <span>4</span></div>
                <div class="tip-desc">多进程/线程解码并发度。增加可提高多核 CPU 吞吐量，内存紧张时可适当调小。</div>
              </span>
            </span>
          </label>
        </div>
      </div>

      <div class="param-group">
        <div class="param-title">评分权重与阈值</div>
        <div class="param-row">
          <label class="field">
            <span class="lbl">锐度阈值</span>
            <input type="number" id="pSharp" step="0.01" value="0.05">
            <span class="tip-wrap">
              <span class="info-icon">i</span>
              <span class="tip-content">
                <div class="tip-title">P0 锐度否决阈值</div>
                <div class="tip-def">默认: <span>0.05</span></div>
                <div class="tip-desc">高频细节比率下限。低于此值直接判定模糊失焦并丢弃。调高严格防虚焦，调低更包容运动拉丝。</div>
              </span>
            </span>
          </label>
          <label class="field">
            <span class="lbl">锐度权重</span>
            <input type="number" id="pWSharp" step="0.1" value="1.5">
            <span class="tip-wrap">
              <span class="info-icon">i</span>
              <span class="tip-content">
                <div class="tip-title">锐度加权系数</div>
                <div class="tip-def">默认: <span>1.5</span></div>
                <div class="tip-desc">计算公式: 1.5 × S_锐度。增大该权重会让清晰锐利的照片得分更突出。</div>
              </span>
            </span>
          </label>
        </div>
        <div class="param-row">
          <label class="field">
            <span class="lbl">构图权重</span>
            <input type="number" id="pWComp" step="0.1" value="2.5">
            <span class="tip-wrap">
              <span class="info-icon">i</span>
              <span class="tip-content">
                <div class="tip-title">构图加权系数</div>
                <div class="tip-def">默认: <span>2.5</span></div>
                <div class="tip-desc">计算公式: 2.5 × S_构图。增大该权重会让主体大小适中且居中的照片得分大幅上升。</div>
              </span>
            </span>
          </label>
          <label class="field">
            <span class="lbl">最低总分</span>
            <input type="number" id="pMinRaw" step="0.1" value="3.1">
            <span class="tip-wrap">
              <span class="info-icon">i</span>
              <span class="tip-content">
                <div class="tip-title">合格保留最低分</div>
                <div class="tip-def">默认: <span>3.1</span></div>
                <div class="tip-desc">总分低于此值的照片直接丢弃淘汰。调高 (如 3.5) 精挑细选，调低 (如 2.8) 提高保留率。</div>
              </span>
            </span>
          </label>
        </div>
        <div class="param-row">
          <label class="field">
            <span class="lbl">置信度</span>
            <input type="number" id="pConf" step="0.01" value="0.25">
            <span class="tip-wrap">
              <span class="info-icon">i</span>
              <span class="tip-content">
                <div class="tip-title">YOLO 检测置信度阈值</div>
                <div class="tip-def">默认: <span>0.25</span></div>
                <div class="tip-desc">目标检测最低置信度。调低捕捉远景微小主体但可能误检；调高保证主体确凿。</div>
              </span>
            </span>
          </label>
          <label class="field">
            <span class="lbl">API Key</span>
            <input type="password" id="pRfKey" placeholder="Roboflow">
            <span class="tip-wrap">
              <span class="info-icon">i</span>
              <span class="tip-content">
                <div class="tip-title">Roboflow 云端 API Key</div>
                <div class="tip-def">默认: <span>留空 (本地模型)</span></div>
                <div class="tip-desc">可选。若配置则使用 Roboflow 线上赛车模型；留空则使用本地 ONNX 模型推理。</div>
              </span>
            </span>
          </label>
        </div>
      </div>

      <div class="param-group">
        <div class="param-title">输出控制</div>
        <div class="param-row">
          <label class="check">
            <input type="checkbox" id="pAutocrop" checked> 自动裁剪
            <span class="tip-wrap">
              <span class="info-icon">i</span>
              <span class="tip-content">
                <div class="tip-title">XMP 自动裁剪元数据</div>
                <div class="tip-def">默认: <span>开启</span></div>
                <div class="tip-desc">开启后自动在 XMP 中写入最佳 3:2/2:3 构图框，Lightroom 导入将直接应用裁剪。</div>
              </span>
            </span>
          </label>
          <label class="check">
            <input type="checkbox" id="pRename"> 重命名
            <span class="tip-wrap">
              <span class="info-icon">i</span>
              <span class="tip-content">
                <div class="tip-title">连拍组批量重命名</div>
                <div class="tip-def">默认: <span>关闭</span></div>
                <div class="tip-desc">开启后将按连拍组序号直接重命名磁盘文件；关闭保持原始文件名不变。</div>
              </span>
            </span>
          </label>
        </div>
        <div class="param-row">
          <label class="check">
            <input type="checkbox" id="pDryRun"> 试运行 (不写文件)
            <span class="tip-wrap">
              <span class="info-icon">i</span>
              <span class="tip-content">
                <div class="tip-title">试运行模式 (Dry-Run)</div>
                <div class="tip-def">默认: <span>关闭</span></div>
                <div class="tip-desc">开启后仅在 GUI 界面展示分析打分与统计，不生成 XMP，不修改任何磁盘文件。</div>
              </span>
            </span>
          </label>
        </div>
      </div>
    </div>
    <button id="toggleParams" class="link params-toggle" type="button">收起设置 ⌃</button>
  </section>

  <section class="progress">
    <div class="progress-track"><div id="bar" class="progress-fill"></div></div>
    <div class="progress-meta">
      <span id="stage">就绪</span>
      <span id="frameStat"></span>
    </div>
  </section>

  <main class="workspace">
    <section class="table-pane">
      <div class="table-toolbar">
        <label class="dim">筛选</label>
        <select id="filter">
          <option value="all" selected>全部</option>
          <option value="keep">仅保留</option>
          <option value="discard">仅丢弃</option>
          <option value="pending">未打分</option>
        </select>
        <span id="count" class="count"></span>
      </div>
      <div class="table-wrap">
        <table id="grid">
          <thead>
            <tr>
              <th data-k="rating">星级</th>
              <th data-k="name">文件</th>
              <th data-k="raw">评分</th>
              <th data-k="sharp">锐度</th>
              <th data-k="comp">构图</th>
              <th data-k="veto">否决原因</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
    <div class="resizer" id="resizer" title="拖动调节左右比例"></div>
    <aside class="preview-pane" id="previewPane">
      <img id="previewImg" alt="" draggable="false">
      <div id="previewOverlay" class="preview-overlay">选中结果行查看预览</div>
    </aside>
  </main>

  <section class="log-pane">
    <div class="log-head">
      <span class="dim">运行日志</span>
      <button id="toggleLog" class="link">收起</button>
    </div>
    <pre id="log" class="hidden"></pre>
  </section>

  <footer class="statusbar" id="status">就绪</footer>

  <script src="app.js"></script>
</body>
</html>
