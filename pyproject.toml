[project]
name = "AutoCullingF1"
version = "0.4"
description = "F1 motorsport photo auto-culling (ONNX LITE VERSION)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tqdm>=4.67.3",
    "pillow-heif>=0.18.0",
    "pillow-avif-plugin>=1.5.5",
    "opencv-python-custom @ https://github.com/Au3C2/AutoCulling-Wheels/releases/download/v5.0.0.93-cull1/opencv_python_custom-5.0.0.93-cp310-cp310-macosx_11_0_arm64.whl ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "opencv-python==5.0.0.93 ; sys_platform != 'darwin' or platform_machine != 'arm64'",
    # Windows: DirectML build (measured ~2x faster scoring-chain inference
    # than the CUDA EP on RTX 4070 Ti, 2026-08-30; CUDA build kept elsewhere).
    "onnxruntime-directml==1.23.0; sys_platform == 'win32'",
    "onnxruntime==1.23.2; sys_platform != 'win32'",
    "onnx>=1.17.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cull"]

[tool.uv]
package = true
